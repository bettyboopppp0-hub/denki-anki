<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>電工暗記ドリル｜第二種電気工事士 筆記</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#333a42; --sub:#8a949e;
    --line:#e8e4dc; --shadow:0 6px 20px rgba(120,110,90,.10);
    --c1:#e0a416; --c2:#7b8794; --c3:#bb7a4c; --c4:#5b8fc9;
    --c5:#9b7bb8; --c6:#5fa07a; --c7:#d0776f;
    --ok:#1e9e5a; --ng:#e05a5a; --amber:#b9770e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    max-width:560px; margin:0 auto; padding:14px 14px 40px;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  h1{font-size:19px; text-align:center; margin:6px 0 2px; letter-spacing:1px;}
  .subtitle{text-align:center; color:var(--sub); font-size:12px; margin:0 0 14px;}
  .hide{display:none !important;}
  button{font-family:inherit; cursor:pointer; border:none;}

  /* progress ring */
  .ringwrap{display:flex; align-items:center; gap:16px; background:var(--card);
    border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px;}
  .ring{position:relative; width:92px; height:92px; flex:0 0 auto;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring .pct b{font-size:22px;} .ring .pct span{font-size:10px; color:var(--sub);}
  .rmeta{flex:1;}
  .rmeta h2{font-size:14px; margin:0 0 4px;}
  .rmeta p{margin:0; font-size:12px; color:var(--sub);}
  .rmeta .weak{color:var(--ng); font-weight:700;}

  /* chips */
  .label{font-size:12px; color:var(--sub); margin:14px 2px 8px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{background:var(--card); border:1.5px solid var(--line); color:var(--ink);
    border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600;}
  .chip.on{color:#fff; border-color:transparent;}
  .chip[data-c="all"].on{background:#5a6570;}
  .chip[data-c="法令"].on{background:var(--c1);}
  .chip[data-c="計器"].on{background:var(--c2);}
  .chip[data-c="配線"].on{background:var(--c3);}
  .chip[data-c="計算"].on{background:var(--c4);}
  .chip[data-c="鑑別"].on{background:var(--c5);}
  .chip[data-c="施工"].on{background:var(--c6);}
  .chip[data-c="工具"].on{background:var(--c7);}
  .cnt{opacity:.65; font-size:11px; margin-left:4px;}

  /* start buttons */
  .menu{display:grid; gap:10px; margin-top:16px;}
  .mbtn{display:flex; align-items:center; gap:12px; text-align:left; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:15px 16px; box-shadow:var(--shadow); width:100%;}
  .mbtn .emo{font-size:24px;}
  .mbtn .t{font-size:15px; font-weight:700;}
  .mbtn .d{font-size:11.5px; color:var(--sub);}
  .mbtn:active{transform:scale(.98);}
  .mbtn.review .t{color:var(--ng);}

  /* top bar in study */
  .bar{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .back{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 12px; font-size:13px;}
  .bar .prog{flex:1; height:8px; background:#eae6de; border-radius:99px; overflow:hidden;}
  .bar .prog i{display:block; height:100%; background:linear-gradient(90deg,#e0a416,#5b8fc9); width:0;}
  .bar .num{font-size:12px; color:var(--sub); min-width:44px; text-align:right;}

  /* flashcard */
  .cattag{display:inline-block; font-size:11px; font-weight:700; color:#fff; padding:3px 10px; border-radius:99px; margin-bottom:10px;}
  .tag法令{background:var(--c1);} .tag計器{background:var(--c2);} .tag配線{background:var(--c3);} .tag計算{background:var(--c4);}
  .tag鑑別{background:var(--c5);} .tag施工{background:var(--c6);} .tag工具{background:var(--c7);}
  .flash{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
    min-height:270px; padding:22px; display:flex; flex-direction:column; justify-content:center;}
  .flash .q{font-size:18px; font-weight:700; line-height:1.7;}
  .flash .hintTap{margin-top:18px; text-align:center; color:var(--sub); font-size:12px;}
  .flash .ans{margin-top:16px; padding-top:16px; border-top:2px dashed var(--line); font-size:16px; line-height:1.8;}
  .flash .ans .em{color:var(--amber); font-weight:800;}
  .flash .ans .memo{display:block; margin-top:8px; font-size:12.5px; color:var(--sub);}
  .grade{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .g{border-radius:14px; padding:15px; font-size:15px; font-weight:700; color:#fff;}
  .g.no{background:var(--ng);} .g.yes{background:var(--ok);}
  .single{display:block; width:100%; border-radius:14px; padding:15px; font-size:15px; font-weight:700;
    color:#fff; background:#5a6570; margin-top:12px;}

  /* quiz */
  .quiz .q{font-size:17px; font-weight:700; margin-bottom:14px; line-height:1.7;}
  .opts{display:grid; gap:10px;}
  .opt{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px 15px;
    font-size:14.5px; text-align:left; width:100%; line-height:1.6;}
  .opt.correct{border-color:var(--ok); background:#eafaf1;}
  .opt.wrong{border-color:var(--ng); background:#fdeeee;}
  .opt:disabled{opacity:1;}
  .fb{margin-top:14px; padding:12px 14px; border-radius:12px; font-size:13.5px; line-height:1.7; display:none;}
  .fb.show{display:block;}
  .fb.o{background:#eafaf1; color:#1c7d48;} .fb.x{background:#fdeeee; color:#b83b3b;}
  .fb b{color:var(--amber);}
  .next{display:block; width:100%; margin-top:12px; border-radius:14px; padding:15px; font-size:15px;
    font-weight:700; color:#fff; background:#5a6570;}

  /* result */
  .result{background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
    padding:26px 20px; text-align:center;}
  .result .big{font-size:40px; font-weight:800; margin:6px 0;}
  .result .msg{font-size:14px; color:var(--sub); margin-bottom:16px;}
  .result .row{display:grid; gap:10px;}
  .footer{text-align:center; color:var(--sub); font-size:11px; margin-top:24px; line-height:1.7;}
  .footer a{color:var(--c4);}

  /* ===== 印刷シート ===== */
  .ptools{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px; box-shadow:var(--shadow); margin-bottom:14px;}
  .ptools .back{margin-bottom:10px;}
  .pmode{display:flex; gap:8px; margin-bottom:10px;}
  .pm{flex:1; background:#fff; border:1.5px solid var(--line); color:var(--ink);
    border-radius:10px; padding:10px 6px; font-size:13px; font-weight:700;}
  .pm.on{background:#5a6570; color:#fff; border-color:transparent;}
  .pweak{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--sub); margin-bottom:10px;}
  .pbtn{width:100%; background:var(--c1); color:#fff; border-radius:12px; padding:13px; font-size:15px; font-weight:700;}
  .phint{font-size:11px; color:var(--sub); margin:8px 0 0; line-height:1.5;}

  .sheet{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px;}
  .sheetHead{border-bottom:2px solid #333a42; padding-bottom:6px; margin-bottom:10px;}
  .sheetHead h3{margin:0; font-size:14px;}
  .sheetHead .meta{font-size:10.5px; color:var(--sub); margin-top:3px; display:flex; justify-content:space-between; gap:8px;}
  .pcat{font-size:11.5px; font-weight:700; margin:10px 0 5px; padding:2px 8px;
    border-left:4px solid #999; background:#f3f1ec; border-radius:0 6px 6px 0; break-after:avoid;}
  .pitem{font-size:11.5px; line-height:1.65; margin-bottom:7px; padding-bottom:6px;
    border-bottom:1px dotted #ddd6c8; break-inside:avoid;}
  .pitem .pq{font-weight:700;}
  .pitem .pq i{font-style:normal; color:#8a949e; margin-right:3px;}
  .pitem .pa{margin-top:2px;}
  .pitem .pa:before{content:"→ "; color:#8a949e;}
  .pitem .pm2{font-size:10.5px; color:#8a949e;}
  .pitem .em{background:#fff6d8; font-weight:700; padding:0 2px;}
  .bl{display:inline-block; min-width:4em; border-bottom:1.3px solid #333a42;
    vertical-align:baseline; height:1.15em;}

  @page{ size:A4 portrait; margin:11mm 10mm; }
  @media print{
    html,body{background:#fff !important;}
    body{max-width:none; margin:0; padding:0; font-size:10pt;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    body > section:not(#print){display:none !important;}
    #print{display:block !important;}
    .ptools{display:none !important;}
    .sheet{border:none; border-radius:0; padding:0; columns:2; column-gap:7mm;}
    .sheetHead{column-span:all;}
    .pitem{font-size:8.6pt; line-height:1.55; margin-bottom:5px;}
    .pitem .pm2{font-size:7.8pt;}
    .pcat{font-size:9pt;}
    a{text-decoration:none; color:inherit;}
  }
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<section id="home">
  <h1>⚡ 電工暗記ドリル</h1>
  <p class="subtitle">第二種電気工事士 筆記の得点源をまるごと暗記</p>

  <div class="ringwrap">
    <div class="ring">
      <svg width="92" height="92">
        <circle cx="46" cy="46" r="40" fill="none" stroke="#eae6de" stroke-width="10"/>
        <circle id="ringFg" cx="46" cy="46" r="40" fill="none" stroke="#e0a416" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="251"/>
      </svg>
      <div class="pct"><b id="pctNum">0%</b><span>覚えた</span></div>
    </div>
    <div class="rmeta">
      <h2 id="masterLine">0 / 0 問マスター</h2>
      <p id="weakLine">苦手マーク：0問</p>
      <p style="margin-top:6px;">毎日ちょっとずつ、すきま時間で💪</p>
    </div>
  </div>

  <div class="label">▼ 分野をえらぶ</div>
  <div class="chips" id="chips">
    <button class="chip on" data-c="all">全部<span class="cnt"></span></button>
    <button class="chip" data-c="法令">法令<span class="cnt"></span></button>
    <button class="chip" data-c="計器">計器<span class="cnt"></span></button>
    <button class="chip" data-c="配線">配線<span class="cnt"></span></button>
    <button class="chip" data-c="計算">計算<span class="cnt"></span></button>
    <button class="chip" data-c="鑑別">鑑別<span class="cnt"></span></button>
    <button class="chip" data-c="施工">施工<span class="cnt"></span></button>
    <button class="chip" data-c="工具">工具<span class="cnt"></span></button>
  </div>

  <div class="menu">
    <button class="mbtn" onclick="startCards()">
      <span class="emo">🃏</span>
      <span><span class="t">カードで覚える</span><br><span class="d">一問一答。タップで答えを確認、覚えた／苦手で仕分け</span></span>
    </button>
    <button class="mbtn" onclick="startQuiz()">
      <span class="emo">✍️</span>
      <span><span class="t">クイズで力だめし</span><br><span class="d">4択問題。まちがえた所は自動で苦手に登録</span></span>
    </button>
    <button class="mbtn review" onclick="startReview()">
      <span class="emo">🔥</span>
      <span><span class="t">苦手だけ復習</span><br><span class="d" id="reviewD">苦手マークした問題をカードで集中特訓</span></span>
    </button>
    <button class="mbtn" onclick="openPrint()">
      <span class="emo">🖨️</span>
      <span><span class="t">印刷してA4に</span><br><span class="d">暗記用（答えあり）と勉強用（空欄）の2種類を印刷</span></span>
    </button>
  </div>

  <p class="footer">
    収録：法令・計器・配線・計算・鑑別・施工・工具の得点源 全<span id="totalN">0</span>問<br>
    データは端末内に保存されます（進捗・苦手）<br>
    <a href="#" onclick="resetAll();return false;">進捗をリセット</a>
  </p>
</section>

<!-- ===== CARDS ===== -->
<section id="cards" class="hide">
  <div class="bar">
    <button class="back" onclick="goHome()">← ホーム</button>
    <div class="prog"><i id="cProg"></i></div>
    <div class="num" id="cNum">0/0</div>
  </div>
  <div id="cardArea"></div>
</section>

<!-- ===== QUIZ ===== -->
<section id="quiz" class="hide">
  <div class="bar">
    <button class="back" onclick="goHome()">← ホーム</button>
    <div class="prog"><i id="qProg"></i></div>
    <div class="num" id="qNum">0/0</div>
  </div>
  <div id="quizArea" class="quiz"></div>
</section>

<!-- ===== RESULT ===== -->
<section id="result" class="hide">
  <div class="result">
    <div style="font-size:34px" id="rEmoji">🎉</div>
    <div class="big" id="rScore">0/0</div>
    <div class="msg" id="rMsg"></div>
    <div class="row">
      <button class="single" style="background:var(--c4)" onclick="location.reload()">もう一度</button>
      <button class="single" onclick="goHome()">ホームへ</button>
    </div>
  </div>
</section>


<!-- ===== PRINT ===== -->
<section id="print" class="hide">
  <div class="ptools">
    <button class="back" onclick="goHome()">← ホーム</button>
    <div class="pmode">
      <button class="pm on" id="pmA" onclick="setPMode('ans')">📖 暗記用<br><small>答えぜんぶ載せ</small></button>
      <button class="pm" id="pmB" onclick="setPMode('blank')">✏️ 勉強用<br><small>大事な所が空欄</small></button>
    </div>
    <label class="pweak"><input type="checkbox" id="pWeak" onchange="renderSheet()"> 苦手マークした問題だけ印刷する</label>
    <label class="pweak" id="pHintWrap"><input type="checkbox" id="pHint" onchange="renderSheet()"> ヒント（💡ゴロあわせ）も隠す ※勉強用のみ</label>
    <button class="pbtn" onclick="window.print()">🖨️ この内容をA4で印刷</button>
    <p class="phint">
      ・PC：Ctrl+P → 用紙「A4」・余白「標準」・「背景のグラフィック」ONで色付き<br>
      ・スマホ：共有 → プリント（PDFで保存もできます）<br>
      ・勉強用と暗記用は同じ番号順なので、暗記用がそのまま答え合わせ用になります。
    </p>
  </div>
  <div id="sheet" class="sheet"></div>
</section>

<script>
/* ============ 問題データ ============ */
const DATA = [
  // ---- 法令 ----
  {c:"法令", q:"電気工事士の<b>資格が必要</b>な作業は？（3つ）", a:'電線管を曲げる／<span class="em">電線相互の接続</span>／配電盤を壁に取り付ける',
   choices:["電力量計（メーター）の取り付け","電線相互の接続","地中に管を埋める（土木作業）","柱を立てる"], correct:1,
   memo:"「つなぐ・曲げる・盤を付ける」は資格いる"},
  {c:"法令", q:"<b>無資格でOK</b>（軽微な作業）はどれ？", a:'<span class="em">電力量計の取付け</span>／差込接続器へコードをねじ止め／柱を立てる／地中に管を埋める',
   choices:["電線管を曲げる","配電盤を壁に取り付ける","電力量計（メーター）の取り付け","低圧電線相互の接続"], correct:2,
   memo:"メーター・ねじ止め・土木はOK"},
  {c:"法令", q:"<b>特定電気用品</b>（危険度が高い）のマークの形は？", a:'ひし形 <span class="em">&lt;PS&gt;E</span>',
   choices:["丸形 (PS)E","ひし形 <PS>E","三角形","四角形"], correct:1,
   memo:"危険＝とがったひし形"},
  {c:"法令", q:"<b>特定電気用品</b>の例は？", a:'漏電遮断器・<span class="em">配線用遮断器</span>・ケーブル・リモコンリレー',
   choices:["換気扇","蛍光ランプ","配線用遮断器・漏電遮断器・ケーブル","電線管"], correct:2,
   memo:"遮断器とケーブルは特定"},
  {c:"法令", q:"<b>特定以外</b>の電気用品のマークの形は？", a:'丸形 <span class="em">(PS)E</span>',
   choices:["ひし形 <PS>E","丸形 (PS)E","星形","六角形"], correct:1,
   memo:"ふつう＝まるい丸形"},
  {c:"法令", q:"<b>特定以外</b>の電気用品の例は？", a:'<span class="em">換気扇</span>・蛍光ランプ・電線管・ライティングダクト・差込接続器',
   choices:["ケーブル","漏電遮断器","換気扇・蛍光ランプ・電線管","配線用遮断器"], correct:2,
   memo:"換気扇・ダクト系は特定以外"},
  {c:"法令", q:"<b>低圧</b>の定義は？（直流・交流）", a:'直流 <span class="em">750V以下</span>・交流 <span class="em">600V以下</span>',
   choices:["直流600V以下・交流750V以下","直流750V以下・交流600V以下","直流100V・交流200V","直流・交流とも600V以下"], correct:1,
   memo:"直流ナ(7)コ(5)・交流ロ(6)ク…「直7交6」"},
  {c:"法令", q:"<b>一般用電気工作物</b>の定義は？", a:'<span class="em">低圧(600V以下)</span>で受電し、同一構内で使用するもの（小出力発電＝太陽光等も含む）',
   choices:["高圧6600Vで受電するもの","低圧600V以下で受電し同一構内で使うもの","特別高圧のもの","発電所のこと"], correct:1,
   memo:"600V以下受電＋同一構内"},
  {c:"法令", q:"電路で<b>地絡（漏電）</b>が生じたときに施設するものは？", a:'<span class="em">地絡遮断器</span>（過電流には過電流遮断器）',
   choices:["過電流遮断器","地絡遮断器","開閉器","避雷器"], correct:1,
   memo:"地絡→地絡遮断器／過電流→過電流遮断器"},
  {c:"法令", q:"保安の原則。電気設備は「感電・火災その他、人体に危害／物件に○○を与えるおそれがないように施設する」。○○は？", a:'<span class="em">損傷</span>',
   choices:["利益","損傷","影響","変化"], correct:1,
   memo:"人体に危害・物件に損傷"},

  // ---- 計器 ----
  {c:"計器", q:"<b>永久磁石可動コイル形</b>（馬蹄形マーク）は何用？", a:'<span class="em">直流用（ー）</span>',
   choices:["交流用（〜）","直流用（ー）","直流・交流両用","高周波用"], correct:1,
   memo:"コイル形＝直流"},
  {c:"計器", q:"<b>可動鉄片形</b>は何用？", a:'<span class="em">交流用（〜）</span>',
   choices:["直流用（ー）","交流用（〜）","直流専用","計測不可"], correct:1,
   memo:"鉄片形＝交流"},
  {c:"計器", q:"計器の姿勢記号「⊥（鉛直線）」の意味は？", a:'計器を <span class="em">鉛直に立てて</span>使う',
   choices:["水平に置く","鉛直に立てる","傾けて置く","向きは自由"], correct:1,
   memo:"⎓＝水平／⊥＝鉛直"},
  {c:"計器", q:"<b>接地抵抗計</b>（電池式）で測定前にすることは？", a:'電池が有効か確認 → 端子を<span class="em">開放</span>してゼロ点調整',
   choices:["端子を短絡して調整","端子を開放してゼロ点調整","そのまま測る","抵抗をつないで調整"], correct:1,

/* ============ 状態 ============ */
const KEY="denki_anki_v1";
let store = JSON.parse(localStorage.getItem(KEY) || '{"mastered":[],"weak":[]}');
function save(){ localStorage.setItem(KEY, JSON.stringify(store)); }
function idOf(item){ return item.c + "|" + item.q; }
let curCat = "all";
const CAT_COLOR = {法令:"var(--c1)",計器:"var(--c2)",配線:"var(--c3)",計算:"var(--c4)",鑑別:"var(--c5)",施工:"var(--c6)",工具:"var(--c7)"};

/* ============ ホーム描画 ============ */
function renderHome(){
  // chip counts
  document.querySelectorAll('.chip').forEach(ch=>{
    const c = ch.dataset.c;
    const n = c==="all" ? DATA.length : DATA.filter(d=>d.c===c).length;
    ch.querySelector('.cnt').textContent = "("+n+")";
    ch.classList.toggle('on', c===curCat);
  });
  const total = DATA.length;
  const mastered = store.mastered.length;
  const pct = total? Math.round(mastered/total*100):0;
  document.getElementById('pctNum').textContent = pct+"%";
  document.getElementById('masterLine').textContent = mastered+" / "+total+" 問マスター";
  document.getElementById('weakLine').innerHTML = '苦手マーク：<span class="weak">'+store.weak.length+'問</span>';
  document.getElementById('totalN').textContent = total;
  const off = 251 - 251*pct/100;
  document.getElementById('ringFg').style.strokeDashoffset = off;
  document.getElementById('reviewD').textContent = store.weak.length
    ? "苦手マークした "+store.weak.length+" 問を集中特訓" : "まずはカードやクイズで苦手を見つけよう";
}

document.getElementById('chips').addEventListener('click', e=>{
  const ch = e.target.closest('.chip'); if(!ch) return;
  curCat = ch.dataset.c; renderHome();
});

function poolByCat(){
  return curCat==="all" ? DATA.slice() : DATA.filter(d=>d.c===curCat);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function show(id){ ['home','cards','quiz','result','print'].forEach(s=>document.getElementById(s).classList.toggle('hide', s!==id)); window.scrollTo(0,0); }
function goHome(){ renderHome(); show('home'); }

/* ============ カードモード ============ */
let cList=[], cIdx=0, flipped=false;
function startCards(){ cList = shuffle(poolByCat()); cIdx=0; if(!cList.length) return; show('cards'); renderCard(); }
function startReview(){
  const weakItems = DATA.filter(d=> store.weak.includes(idOf(d)));
  if(!weakItems.length){ alert("苦手マークはまだありません。カードやクイズで見つけましょう！"); return; }
  cList = shuffle(weakItems); cIdx=0; show('cards'); renderCard();
}
function renderCard(){
  flipped=false;
  const it = cList[cIdx];
  document.getElementById('cNum').textContent = (cIdx+1)+"/"+cList.length;
  document.getElementById('cProg').style.width = ((cIdx)/cList.length*100)+"%";
  const isWeak = store.weak.includes(idOf(it));
  const isMas = store.mastered.includes(idOf(it));
  document.getElementById('cardArea').innerHTML = `
    <span class="cattag tag${it.c}">${it.c}</span>
    ${isWeak?'<span class="cattag" style="background:var(--ng)">苦手</span>':''}
    ${isMas?'<span class="cattag" style="background:var(--ok)">覚えた</span>':''}
    <div class="flash" id="flash" onclick="flip()">
      <div class="q">${it.q}</div>
      <div class="hintTap" id="tapHint">タップで答えを見る 👆</div>
      <div class="ans hide" id="ans">${it.a}<span class="memo">💡 ${it.memo||""}</span></div>
    </div>
    <div id="gradeWrap"></div>`;
}
function flip(){
  if(flipped) return; flipped=true;
  document.getElementById('ans').classList.remove('hide');
  document.getElementById('tapHint').classList.add('hide');
  document.getElementById('gradeWrap').innerHTML = `
    <div class="grade">
      <button class="g no" onclick="gradeCard(false)">まだ苦手 🔥</button>
      <button class="g yes" onclick="gradeCard(true)">覚えた ✓</button>
    </div>`;
}
function gradeCard(ok){
  const it = cList[cIdx]; const id = idOf(it);
  store.weak = store.weak.filter(x=>x!==id);
  store.mastered = store.mastered.filter(x=>x!==id);
  if(ok) store.mastered.push(id); else store.weak.push(id);
  save();
  cIdx++;
  if(cIdx>=cList.length){ finishCards(); } else { renderCard(); }
}
function finishCards(){
  document.getElementById('cProg').style.width="100%";
  const learned = cList.filter(it=>store.mastered.includes(idOf(it))).length;
  document.getElementById('rEmoji').textContent = "🃏";
  document.getElementById('rScore').textContent = learned+"/"+cList.length;
  document.getElementById('rMsg').textContent = "このセットで「覚えた」"+learned+"問！ 苦手は復習でくり返そう。";
  show('result');
}

/* ============ クイズモード ============ */
let qList=[], qIdx=0, qScore=0;
function startQuiz(){
  qList = shuffle(poolByCat()).filter(d=>d.choices); qIdx=0; qScore=0;
  if(!qList.length){ alert("この分野にクイズはありません"); return; }
  show('quiz'); renderQuiz();
}
function renderQuiz(){
  const it = qList[qIdx];
  document.getElementById('qNum').textContent = (qIdx+1)+"/"+qList.length;
  document.getElementById('qProg').style.width = ((qIdx)/qList.length*100)+"%";
  // build shuffled options keeping track of correct
  const opts = it.choices.map((t,i)=>({t, ok:i===it.correct}));
  shuffle(opts);
  let html = `<span class="cattag tag${it.c}">${it.c}</span>
    <div class="q">${it.q}</div><div class="opts">`;
  opts.forEach((o,i)=>{ html += `<button class="opt" onclick="answer(this,${o.ok})">${o.t}</button>`; });
  html += `</div><div class="fb" id="fb"></div><button class="next hide" id="nextBtn" onclick="nextQuiz()">次へ →</button>`;
  document.getElementById('quizArea').innerHTML = html;
}
function answer(btn, ok){
  const it = qList[qIdx]; const id = idOf(it);
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const correct = b.getAttribute('onclick').includes('true');
    if(correct) b.classList.add('correct');
  });
  const fb = document.getElementById('fb');
  if(ok){
    qScore++; btn.classList.add('correct');
    fb.className="fb show o"; fb.innerHTML = "⭕ 正解！ <b>"+stripEm(it.a)+"</b><br>💡 "+(it.memo||"");
    // 正解したら苦手から外す
    store.weak = store.weak.filter(x=>x!==id);
    if(!store.mastered.includes(id)) store.mastered.push(id);
  }else{
    btn.classList.add('wrong');
    fb.className="fb show x"; fb.innerHTML = "❌ 正解は <b>"+stripEm(it.a)+"</b><br>💡 "+(it.memo||"");
    // まちがえたら苦手に登録
    store.mastered = store.mastered.filter(x=>x!==id);
    if(!store.weak.includes(id)) store.weak.push(id);
  }
  save();
  document.getElementById('nextBtn').classList.remove('hide');
}
function stripEm(s){ return s.replace(/<[^>]+>/g,''); }
function nextQuiz(){
  qIdx++;
  if(qIdx>=qList.length){ finishQuiz(); } else { renderQuiz(); }
}
function finishQuiz(){
  document.getElementById('qProg').style.width="100%";
  const pct = Math.round(qScore/qList.length*100);
  document.getElementById('rEmoji').textContent = pct>=80?"🎉":pct>=50?"👍":"💪";
  document.getElementById('rScore').textContent = qScore+"/"+qList.length;
  document.getElementById('rMsg').textContent = pct>=80?"すばらしい！この分野はバッチリ🎉"
    : pct>=50?"いい調子！まちがえた所は苦手復習で仕上げよう。" : "まちがえた所は苦手に登録済み。復習でくり返そう🔥";
  show('result');
}

/* ============ リセット ============ */
function resetAll(){
  if(confirm("進捗（覚えた・苦手）をすべて消しますか？")){
    store={mastered:[],weak:[]}; save(); renderHome();
  }
}

/* ============ 印刷モード ============ */
const CAT_ORDER = ["法令","計器","配線","計算","鑑別","施工","工具"];
let pMode = "ans";
function openPrint(){ show('print'); renderSheet(); }
function setPMode(m){
  pMode = m;
  document.getElementById('pmA').classList.toggle('on', m==="ans");
  document.getElementById('pmB').classList.toggle('on', m==="blank");
  renderSheet();
}
/* 覚えるところ（<span class="em">）を下線の空欄にする */
function blankify(html){
  return html.replace(/<span class="em">([\s\S]*?)<\/span>/g, function(_, inner){
    const plain = inner.replace(/<[^>]+>/g, "");
    const w = Math.min(Math.max(plain.length, 4), 18);
    return '<span class="bl" style="min-width:' + (w * 0.95) + 'em"></span>';
  });
}
function renderSheet(){
  const weakOnly = document.getElementById('pWeak').checked;
  let list = poolByCat();
  if(weakOnly) list = list.filter(d => store.weak.includes(idOf(d)));
  const isBlank = (pMode === "blank");
  const hideMemo = isBlank && document.getElementById('pHint').checked;
  document.getElementById('pHintWrap').style.opacity = isBlank ? "1" : ".4";
  const catName = (curCat === "all") ? "全分野" : curCat;
  const modeName = isBlank ? "勉強用（空欄）" : "暗記用（答えあり）";

  let html = '<div class="sheetHead">'
    + '<h3>⚡ 電工暗記ドリル｜第二種電気工事士 筆記　<span style="font-weight:400">' + modeName + '</span></h3>'
    + '<div class="meta"><span>分野：' + catName + (weakOnly ? '（苦手だけ）' : '') + '　全' + list.length + '問</span>'
    + '<span>名前 ____________　日付 ____ / ____</span></div></div>';

  if(!list.length){
    html += '<p style="font-size:12px;color:#8a949e">この条件の問題がありません。分野や「苦手だけ」の設定を見なおしてください。</p>';
    document.getElementById('sheet').innerHTML = html;
    return;
  }

  let n = 0;
  CAT_ORDER.forEach(cat => {
    const items = list.filter(d => d.c === cat);
    if(!items.length) return;
    html += '<div class="pcat" style="border-left-color:' + (CAT_COLOR[cat] || "#999") + '">' + cat + '（' + items.length + '問）</div>';
    items.forEach(it => {
      n++;
      const ans = isBlank ? blankify(it.a) : it.a;
      html += '<div class="pitem">'
        + '<div class="pq"><i>Q' + n + '.</i>' + it.q + '</div>'
        + '<div class="pa">' + ans + '</div>'
        + ((it.memo && !hideMemo) ? '<div class="pm2">💡 ' + it.memo + '</div>' : '')
        + '</div>';
    });
  });
  document.getElementById('sheet').innerHTML = html;
}
/* どの画面から Ctrl+P しても印刷シートが出るように */
window.addEventListener('beforeprint', function(){
  if(document.getElementById('print').classList.contains('hide')) openPrint();
});

/* ?print=ans / ?print=blank で印刷シートを直接ひらく（&cat=鑑別 で分野指定も可） */
(function(){
  const q = new URLSearchParams(location.search);
  const m = q.get('print');
  if(!m) return;
  const c = q.get('cat'); if(c) curCat = c;
  if(q.get('hint')==='off') { const h=document.getElementById('pHint'); if(h) h.checked = true; }
  pMode = (m === 'blank') ? 'blank' : 'ans';
  setPMode(pMode);
  openPrint();
})();

renderHome();

/* PWA: service worker */
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
